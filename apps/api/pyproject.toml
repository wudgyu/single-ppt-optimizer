[project]
name = "ppt-single-slide-optimizer-api"
version = "0.1.0"
description = "FastAPI orchestration service for the single-slide optimizer."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "pillow==11.3.0",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "PyMuPDF==1.26.4",
  "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.2",
  "ruff==0.12.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["fitz"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-ra"
