name: Continuous Integration

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API checks
    runs-on: ubuntu-latest
    env:
      UV_CACHE_DIR: /tmp/.uv-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        working-directory: apps/api
        run: uv sync --locked
      - name: Check lockfile
        working-directory: apps/api
        run: uv lock --check
      - name: Check formatting
        working-directory: apps/api
        run: uv run ruff format --check .
      - name: Lint
        working-directory: apps/api
        run: uv run ruff check .
      - name: Check types
        working-directory: apps/api
        run: uv run mypy app
      - name: Test
        working-directory: apps/api
        run: uv run pytest

  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Check types
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  pptx-generator:
    name: PPTX generator checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/pptx-generator/package-lock.json
      - name: Install dependencies
        working-directory: apps/pptx-generator
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Check types
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  contracts:
    name: Shared contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - name: Install dependencies
        working-directory: packages/contracts
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Check types
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
